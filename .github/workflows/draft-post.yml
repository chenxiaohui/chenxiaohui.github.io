name: Create AI-assisted draft post

on:
  workflow_dispatch:
    inputs:
      idea_title:
        description: Optional topic wording
        required: false
        type: string
      idea_url:
        description: Optional public HTTPS source
        required: false
        type: string
      skip_image:
        description: Use the neutral checked-in cover
        required: false
        default: false
        type: boolean
      dry_run:
        description: Generate artifact without branch or PR
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ai-draft-post
  cancel-in-progress: false

jobs:
  create-draft:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ai.txt

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.12"
          bundler: "2.6.9"
          bundler-cache: true

      - name: Install Python dependencies
        run: python -m pip install -r requirements-ai.txt

      - name: Run offline automation tests
        run: python -m pytest automation/tests -q

      - name: Generate one draft
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          IDEA_TITLE: ${{ inputs.idea_title }}
          IDEA_URL: ${{ inputs.idea_url }}
          SKIP_IMAGE: ${{ inputs.skip_image }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--output-json automation/output/result.json)
          if [[ -n "$IDEA_TITLE" ]]; then args+=(--idea-title "$IDEA_TITLE"); fi
          if [[ -n "$IDEA_URL" ]]; then args+=(--idea-url "$IDEA_URL"); fi
          if [[ "$SKIP_IMAGE" == "true" ]]; then args+=(--skip-image); fi
          if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          python -m automation.blog_ai.pipeline "${args[@]}"

      - name: Read generation result
        id: result
        if: always() && hashFiles('automation/output/result.json') != ''
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(Path("automation/output/result.json").read_text(encoding="utf-8"))
          values = {
              "status": result.get("status", ""),
              "post_path": result.get("post_path") or "",
              "image_path": result.get("image_path") or "",
              "article_title": "",
          }
          post_path = values["post_path"]
          if post_path and Path(post_path).exists():
              for line in Path(post_path).read_text(encoding="utf-8").splitlines():
                  if line.startswith("title: "):
                      values["article_title"] = line.removeprefix("title: ").strip()
                      break
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for key, value in values.items():
                  if any(character in value for character in "\r\n"):
                      raise ValueError("workflow output contains a newline")
                  output.write(f"{key}={value}\n")
          PY

      - name: Validate generated repository files
        if: steps.result.outputs.status == 'generated' && inputs.dry_run == false
        env:
          POST_PATH: ${{ steps.result.outputs.post_path }}
          IMAGE_PATH: ${{ steps.result.outputs.image_path }}
        run: |
          python tools/validate_ai_post.py "$POST_PATH" "$IMAGE_PATH"
          JEKYLL_ENV=production bundle exec jekyll build
          bundle exec ruby tools/validate_site.rb _site

      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-draft-${{ github.run_id }}
          retention-days: 7
          include-hidden-files: false
          if-no-files-found: ignore
          path: |
            automation/output/result.json
            automation/output/research.json
            automation/output/preview/
            ${{ steps.result.outputs.post_path }}
            ${{ steps.result.outputs.image_path }}

      - name: Create Draft PR
        if: steps.result.outputs.status == 'generated' && inputs.dry_run == false
        env:
          POST_PATH: ${{ steps.result.outputs.post_path }}
          IMAGE_PATH: ${{ steps.result.outputs.image_path }}
          ARTICLE_TITLE: ${{ steps.result.outputs.article_title }}
        run: |
          branch="ai-draft/${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -- "$POST_PATH" "$IMAGE_PATH"
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "2"
          git commit -m "draft: add AI-assisted article"
          git push origin "$branch"
          gh pr create --draft --base master --head "$branch" --title "Draft: $ARTICLE_TITLE" --body-file /tmp/ai-draft-pr-body.md
