name: Validate site

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.12"
          bundler: "2.6.9"
          bundler-cache: true
      - run: bundle exec ruby -Itest test/site_channels_test.rb
      - run: bundle exec ruby -Itest test/year_archive_test.rb
      - run: JEKYLL_ENV=production bundle exec jekyll build
      - run: bundle exec ruby -Itest test/home_visual_test.rb
      - run: bundle exec ruby -Itest test/archive_visual_test.rb
      - run: bundle exec ruby -Itest test/public_content_test.rb
      - run: node test/archive_interaction_test.js
      - run: bundle exec ruby tools/validate_site.rb _site
