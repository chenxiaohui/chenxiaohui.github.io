<footer class="footer py-4 js-page-footer">
  <div class="main">
    {% assign profile = site.data.site_profile %}
    <div itemscope itemtype="https://schema.org/Person">
      <meta itemprop="name" content="{{ profile.name }}">
      <meta itemprop="url" content="{{ '/about/' | absolute_url }}">
      <meta itemprop="description" content="{{ profile.tagline }}">
      <p><a href="{{ '/about/' | relative_url }}">{{ profile.name }}</a> · {{ profile.tagline }}</p>
    </div>
    {% include snippets/get-locale-string.html key='COPYRIGHT_DATES' %}
    {% assign _locale_copyright_dates = __return %}
    <div class="site-info mt-2">
      © {{ profile.name }} {{ _locale_copyright_dates }},
      Powered by <a title="Jekyll is a simple, blog-aware, static site generator." href="https://jekyllrb.com/">Jekyll</a> &amp;
      <a title="TeXt is a super customizable Jekyll theme." href="https://github.com/kitian616/jekyll-TeXt-theme">TeXt Theme</a>.
    </div>
  </div>
</footer>
