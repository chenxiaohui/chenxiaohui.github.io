---
layout: page
---
{% assign groups = site.posts | group_by_exp: "post", "post.date | date: '%Y'" %}
<div class="layout--archive">
  <ul class="archive-years">
    {% for group in groups %}
      <li>
        <a href="{{ '/archive/' | append: group.name | append: '/' | relative_url }}">{{ group.name }}</a>
        <span>{{ group.items | size }} 篇</span>
      </li>
    {% endfor %}
  </ul>
</div>

{{ content }}
